# FlameForge Station Profiles Configuration
# Station profiles define behavior and permissions for forge stations
# No tier definitions here - tiers are in the tiers/ directory

# ============================================================
# STATION PROFILES
# ============================================================

# Default profile - standard MMO forge experience
default:
  station-id: default
  max-tier: -1
  permissions: []
  menu: default
  animation: default
  announcement-radius: 0

# Basic profile - limited tiers for new players
basic:
  station-id: basic
  max-tier: 3
  permissions: []
  menu: default
  animation: default
  announcement-radius: 0

# Premium profile - all tiers, requires permission
premium:
  station-id: premium
  max-tier: -1
  permissions:
    - flameforge.premium
  menu: default
  animation: default
  announcement-radius: 16

# Admin profile - grants all command access
admin:
  station-id: admin
  max-tier: -1
  permissions:
    - flameforge.admin
  menu: default
  animation: default
  announcement-radius: 0

# Compact profile - uses smaller menu
compact-profile:
  station-id: compact
  max-tier: 5
  permissions: []
  menu: compact
  animation: default
  announcement-radius: 0

