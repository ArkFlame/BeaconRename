# FlameForge Messages Configuration
# MMO Forge Theme: dark_gray, purple, white, lime, gold
# All messages use MiniMessage formatting
# Placeholders: %player_name%, %player%, %display_name%, %world%, %world_name%,
#               %online%, %online_players%, %max_players%, %health%, %health_points%,
#               %food%, %xp_level%, %item_name%, %item_in_hand%

# ============================================================
# STARTUP MESSAGES
# ============================================================

startup:
  loading: "<yellow>FlameForge is still loading: <white>%pending_components%"
  failed: "<red>FlameForge startup failed in <white>%component%<red>: <white>%reason% <gray>(reference: %reference%)"
  failed-retryable: "<yellow>Correct the reported file and run <white>/flameforge reload<yellow> to retry startup."
  restart-required: "<red>Correct the console error and restart the server."
  unavailable: "<red>FlameForge is disabled or shutting down."

# ============================================================
# COMMAND MESSAGES
# ============================================================

# Main command
command:
  unknown: "<red>Unknown command. Use <white>/flameforge help <gray>for available commands."

# Help command
help:
  no-permission: "<red>Permission required: <white>%permission%"
  border: "<dark_gray>========================================"
  root-header: "<gradient:#ff5f00:#ffd166><bold>%plugin_name% %plugin_version%</bold></gradient> <gray>by <white>%plugin_authors%"
  group-header: "<gradient:#ff5f00:#ffd166><bold>%plugin_name% %group_name%</bold></gradient>"
  entry: "<gradient:#ff8a00:#ffe29a>/%label% %usage%</gradient> <dark_gray>- <gray>%description%"
  hover: "<gray>Click to insert <white>/%label% %suggestion%"
  empty: "<yellow>No commands are available for this path."
  unknown-path: "<red>Unknown help path: <white>%path%"
  descriptions:
    help: "Show this help message"
    open: "Open the forge menu"
    open-others: "Open forge menu for another player"
    tiers: "List all forge tiers"
    tier-info: "Show tier details"
    preview: "Preview forge outcomes"
    history: "View your forge history"
    history-others: "View another player's forge history"
    station-teleport: "Teleport to a forge station"
    station-add: "Add a new forge station"
    station-remove: "Remove a forge station"
    station-list: "List all forge stations"
    station-info: "Show station details"
    reload: "Reload configuration"
    validate: "Validate configuration"
    setup-tier-create: "Create a new tier"
    setup-tier-clone: "Clone an existing tier"
  categories:
    general: "General"
    forging: "Forging"
    forge-management: "Forge Management"
    administration: "Administration"

# Open command
open:
  no-permission: "<red>Permission required to open your forge menu: <white>%permission%"
  no-permission-others: "<red>Permission required to open another player's forge menu: <white>%permission%"
  player-only: "<red>This command can only be used by a player."
  player-offline: "<red>Target player is offline."
  forge-not-found: "<red>No forge found with id: <white>%station_id%"
  profile-not-found: "<red>Forge '<white>%station_id%<red>' has no valid station profile."
  station-permission-required: "<red>You do not have permission to use this forge. Required: <white>%permission%"
  no-allowed-tier: "<red>You do not have an allowed tier for this forge."
  scheduler-rejected: "<red>The scheduler rejected opening forge '<white>%station_id%<red>': <white>%reason% <gray>(reference: %reference%)"
  menu-open-failed: "<red>Failed to open forge '<white>%station_id%<red>': <white>%reason% <gray>(reference: %reference%)"
  player-retired: "<red>The player disconnected before the forge could be opened."
  menu-opened: "<green>Forge menu opened for <white>%player_name%<green> at station <white>%station_id%<green>."

# Forge interact listener
forge-interact:
  open-failed: "<red>Failed to open forge: <white>%status%<red><gray> (station: <white>%station_id%<gray>)"

# Reload command
reload:
  no-permission: "<red>Permission required: <white>%permission%"
  started: "<yellow>Reloading FlameForge configuration..."
  success: "<green>Configuration applied. Runtime services refreshed."
  validation-rejected: "<red>Reload rejected because configuration validation found errors. The previous configuration remains active."
  validation-error-entry: "<red>%path%: %message%"
  already-running: "<yellow>A FlameForge reload is already running."
  already-loading: "<yellow>FlameForge startup is already running."
  startup-retry-started: "<yellow>Retrying FlameForge startup..."
  startup-already-loading: "<yellow>FlameForge startup is already running."
  startup-already-ready: "<yellow>FlameForge is already ready."
  restart-required: "<red>This startup failure requires a full server restart."
  scheduler-rejected: "<red>The scheduler rejected the reload task. Reference: %reference%"
  load-failed: "<red>Configuration reload could not read/parse the files: %reason% <gray>(%reference%)"
  runtime-refresh-failed: "<red>Configuration loaded, but runtime refresh failed: %reason% <gray>(%reference%)"
  unavailable: "<red>FlameForge is disabled or shutting down."

# Validate command
validate:
  no-permission: "<red>Permission required: <white>%permission%"
  started: "<yellow>Validating FlameForge configuration without applying changes..."
  passed: "<green>Configuration validation passed with no errors."
  error: "<red>%path%: %message%"
  warning: "<yellow>%path%: %message%"
  already-running: "<yellow>A configuration reload or validation is already running."
  scheduler-rejected: "<red>The scheduler rejected validation. Reference: %reference%"
  load-failed: "<red>Configuration validation could not run: <white>%reason% <gray>(reference: %reference%)"

# Tiers command
tiers:
  no-permission: "<red>Permission required: <white>%permission%"
  header: "<gold>=== <white>Tiers</white></gold> ==="
  entry: "<yellow>%tier_id% <gray>(Priority: <white>%priority%<gray>)"
  empty: "<yellow>No tiers configured."
  footer: "<gray>Use <white>/flameforge tiers <page> <gray>for more pages."

# Tier info command
tier-info:
  no-permission: "<red>Permission required: <white>%permission%"
  usage: "<red>Usage: <white>/flameforge tier info <tier>"
  header: "<gold>=== <white>Tier: %tier_id% <gold>==="
  priority: "<white>Priority: <yellow>%priority%"
  success-animation: "<white>Success Animation: <yellow>%duration% ticks"
  fail-animation: "<white>Fail Animation: <yellow>%duration% ticks"
  cost-mode: "<white>Cost Mode: <yellow>%mode%"
  enabled: "<white>Enabled: <yellow>%enabled%"
  cooldown: "<white>Cooldown: <yellow>%seconds% seconds"
  outcomes-header: "<white>Outcomes <gray>(%count%):"
  outcome-entry: "<yellow>  - %outcome_id% <gray>(<white>%type%<gray>, weight: <white>%weight%<gray>)"
  not-found: "<red>Tier not found: <white>%tier_id%"

# Preview command
preview:
  no-permission: "<red>Permission required: <white>%permission%"
  player-only: "<red>This command can only be used by a player."
  usage: "<red>Usage: <white>/flameforge preview <tier> [material]"
  tier-not-found: "<red>Tier not found: <white>%tier_id%"
  no-item: "<red>You must be holding an item to preview."
  unknown-material: "<red>Unknown material: <white>%material%"
  no-outcomes: "<yellow>This tier has no outcomes configured."
  result: "<green>Preview for tier '<white>%tier_id%<green>':"
  result-material: "<white>Result material: <yellow>%material%"
  no-modify: "<yellow>This tier does not modify items."

# History command
history:
  no-permission: "<red>Permission required: <white>%permission%"
  usage: "<red>Usage: <white>/flameforge history <player>"
  header: "<gold>History for <white>%player_name%<gold>:"
  no-history: "<yellow>No history found for <white>%player_name%"
  current-tier: "<white>Current Tier: <yellow>%tier%"
  reforges: "<white>Reforges: <yellow>%count%"
  pity-cooldown: "<white>Pity Cooldown: <yellow>%remaining%ms remaining"
  not-implemented: "<gray>(Full history log not yet implemented)"

# Station command
station:
  usage: "<red>Usage: <white>/flameforge station <add|remove|list|info|teleport> [args]"
  unknown: "<red>Unknown station command. Use <white>/flameforge station list <gray>to see available commands."

# Station add
station-add:
  no-permission: "<red>Permission required to register a forge: <white>%permission%"
  player-only: "<red>This command can only be used by a player."
  invalid-id: "<red>Invalid forge id '<white>%station_id%<red>'. Use letters, numbers, underscore, and hyphen only."
  unknown-profile: "<red>Unknown station profile: <white>%profile%"
  no-block: "<red>You must be looking at a non-air block."
  target-unavailable: "<red>The targeted block's world/chunk is unavailable. Move closer and retry."
  duplicate-id: "<red>A forge already uses id: <white>%station_id%"
  duplicate-location: "<red>A forge is already registered at that block."
  storage-conflict: "<red>The station file <white>stations/%station_id%.yml<red> already exists but was not loaded. Correct or remove that file before reusing this ID. Reference: %reference%"
  persistence-failed: "<red>The station could not be saved to <white>stations/%station_id%.yml<red>. No station was registered. Reference: %reference%"
  id-generation-exhausted: "<red>Could not generate a unique forge id after eight attempts."
  player-retired: "<red>The player disconnected before the target block could be resolved."
  success: "<green>Forge registered: <white>%station_id%"

# Teleport command alias
tp:
  no-permission: "<red>Permission required: <white>%permission%"
  player-only: "<red>This command can only be used by a player."
  success: "<green>Teleported to forge: <white>%station_id%"
  player-offline: "<red>Target player is offline."
  station-missing: "<red>No forge found with id: <white>%station_id%"
  world-not-found: "<red>Forge world '<white>%world%<red>' could not be found."
  world-not-loaded: "<red>Forge world '<white>%world%<red>' is not loaded. Move closer and retry."
  teleport-rejected: "<red>Teleport was rejected by the server."
  teleport-exception: "<red>Teleport failed: <white>%reason% <gray>(reference: %reference%)"
  player-retired: "<red>The player disconnected before teleport could complete."
  scheduler-rejected: "<red>The scheduler rejected the teleport task. Reference: %reference%"

# Station remove
station-remove:
  no-permission: "<red>Permission required: <white>%permission%"
  success: "<green>Forge removed: <white>%station_id%"
  not-found: "<red>No forge found with id: <white>%station_id%"
  persistence-failed: "<red>Station '<white>%station_id%<red>' remains registered because <white>stations/%station_id%.yml<red> could not be removed. Reference: %reference%"

# Station list
station-list:
  no-permission: "<red>Permission required: <white>%permission%"
  header: "<gold>=== <white>Stations</white></gold> ==="
  entry: "<yellow>%station_id% <gray>[<white>%world% %x%,%y%,%z%<gray>] <gray>(Profile: <white>%profile%<gray>)"
  empty: "<yellow>No stations configured."
  footer: "<gray>Use <white>/flameforge station list <page> <gray>for more pages."

# Station info
station-info:
  no-permission: "<red>Permission required: <white>%permission%"
  usage: "<red>Usage: <white>/flameforge station info <id>"
  header: "<gold>=== <white>Station: %station_id% <gold>==="
  world: "<white>World: <yellow>%world%"
  location: "<white>Location: <yellow>%x%, %y%, %z%"
  profile: "<white>Profile: <yellow>%profile%"
  max-tier: "<white>Max Tier: <yellow>%max_tier%"
  not-found: "<red>Station not found: <white>%station_id%"

# Station teleport
station-teleport:
  no-permission: "<red>Permission required: <white>%permission%"
  player-only: "<red>This command can only be used by a player."
  success: "<green>Teleported to forge: <white>%station_id%"

# Setup tier command
setup:
  no-permission: "<red>Permission required: <white>%permission%"
  usage: "<red>Usage: <white>/flameforge setup tier <create|clone> [args]"
  unknown: "<red>Unknown setup command. Use <white>/flameforge setup tier create|clone"

# Setup tier create
setup-tier-create:
  no-permission: "<red>You don't have permission to create tiers."
  usage: "<red>Usage: <white>/flameforge setup tier create <id> <priority>"
  priority-invalid: "<red>Priority must be a number."
  already-exists: "<red>Tier already exists: <white>%tier_id%"
  success: "<green>Tier '<white>%tier_id%<green>' created with priority <white>%priority%<green>."
  note: "<yellow>Note: New tiers are not populated with default outcomes. Edit the tier file manually."

# Setup tier clone
setup-tier-clone:
  source-not-found: "<red>Source tier not found: <white>%source_id%"
  no-permission: "<red>You don't have permission to clone tiers."
  usage: "<red>Usage: <white>/flameforge setup tier clone <source> <id> <priority>"
  priority-invalid: "<red>Priority must be a number."
  already-exists: "<red>Tier already exists: <white>%new_id%"
  success: "<green>Tier '<white>%new_id%<green>' cloned from '<white>%source_id%<green>' with priority <white>%priority%<green>."
  note: "<yellow>Note: Cloned tiers inherit all settings. Edit the tier file manually to adjust."

# ============================================================
# SUCCESS / ERROR / TITLE / ACTIONBAR MESSAGES
# ============================================================

# Forge outcomes
forge:
  success:
    title: "<gold><bold>FORGE SUCCESS!"
    subtitle: "<white>%player_name% <green>received a powerful item!"
  fail:
    title: "<red><bold>FORGE FAILED"
    subtitle: "<white>%player_name% <red>lost their item"
  ward-converted:
    title: "<aqua><bold>WARD PROTECTED"
    subtitle: "<white>Your item was protected by a ward"

# Cooldown messages
cooldown:
  active: "<red>You are on cooldown. Wait <yellow>%remaining%s<red>."
  expired: "<green>Cooldown expired. You can forge again."



# Insufficient funds / XP
cost:
  insufficient-xp: "<red>Insufficient XP. Need <light_purple>%required% XP<red>."
  insufficient-money: "<red>Insufficient funds. Need <green>$%required%<red>."
  insufficient-both: "<red>Insufficient resources. Need <light_purple>%xp_required% XP<red> and <green>$%money_required%<red>."
  xp-line: "<light_purple>XP Cost: <light_purple>%cost% XP"
  money-line: "<green>Money Cost: <green>$%cost%"
  not-affordable: "<red>(Not affordable)"

# Item validation
validation:
  no-item: "<red>No item found in input slot."
  wrong-stack-size: "<red>Stack size must be exactly 1."
  item-not-allowed: "<red>This item cannot be forged at this station."
  tier-locked: "<red>This tier is locked at your station. Upgrade to access."
  tier-unavailable: "<red>This tier is currently unavailable."



# Announcement titles (for title/subtitle broadcasts)
announcements:
  success:
    title: "<gold><bold>FORGE SUCCESS!"
    subtitle: "<white>%player_name% <green>received a powerful item!"
  fail:
    title: "<red><bold>FORGE FAILED"
    subtitle: "<white>%player_name% <red>lost their item"

# ============================================================
# MENU MESSAGES
# ============================================================

menu:
  title: "FlameForge"  # 1.8-safe title (no MiniMessage)
  filler-name: " "
  input-placeholder:
    name: "<dark_gray><bold>Input Item"
    lore:
      - "<gray>Place your item here"
      - "<gray>(Stack size must be exactly 1)"

  confirm-available:
    name: "<green><bold>Confirm Forge"
  confirm-unavailable:
    name: "<red><bold>Cannot Afford"
  previous-enabled:
    name: "<yellow><bold>Previous Page"
    lore:
      - "<gray>Click to go to previous page"
  previous-disabled:
    name: "<gray><bold>Previous Page"
    lore:
      - "<red>No previous page"
  next-enabled:
    name: "<yellow><bold>Next Page"
    lore:
      - "<gray>Click to go to next page"
  next-disabled:
    name: "<gray><bold>Next Page"
    lore:
      - "<red>No next page"
  close:
    name: "<red><bold>Close"
    lore:
      - "<gray>Click to close the menu"
  input-occupied: "<red>That input slot is already occupied."
  item-inserted: "<green>Item inserted into the forge."
  item-denied:
    no-tier: "<red>This item cannot be forged because there are no tiers available."
    invalid-identity: "<red>This forged item contains invalid FlameForge data and cannot be used safely."
    unsupported: "<red>This item type is not supported by the next forge tier."
    customized: "<red>This item contains custom data that cannot be forged safely."
    cursed: "<red>This cursed item cannot be forged again."
    station: "<red>This forge station cannot upgrade this item to its next tier."
    permission: "<red>You do not have permission to use the next forge tier."
    empty: "<red>Please insert an item."
  requirements-not-met: "<red>You do not meet the forge requirements yet."
  item-returned: "<green>Item returned to your inventory."
  item-dropped: "<yellow>Item dropped at your feet."
  item-queued: "<green>Item added to delivery queue."
  stale-click: "<yellow>Nothing happened. Try again."
  cursor-not-empty: "<red>Your cursor must be empty."
  forge-already-started: "<yellow>The forge is already processing an item."
  forge-start-failed: "<red>Failed to start forging."
  no-input: "<red>No item found in input slot."
  info:
    name: "<gold><bold>FlameForge"
    lore:
      - "<gray>Welcome to the FlameForge"
      - "<gray>Place items in the slots below"
      - "<gray>Select a tier and confirm to forge"

# ============================================================
# DELIVERY / PENDING MESSAGES
# ============================================================

delivery:
  pending-title: "<yellow>Items Pending Delivery"
  pending-lore:
    - "<gray>You have items waiting"
    - "<gray>Click to collect"
  delivered: "<green>Item delivered to your inventory."
  dropped: "<yellow>Item dropped at your feet."
  full-inventory: "<yellow>Your inventory is full. Item dropped at your feet."
