# FlameForge Messages Configuration
# Command/admin messages use the FlameForge palette:
#   headers: dark_gray separator + orange gradient title
#   success/error/warning: gradient glyph prefixes
#   rows: dark_gray bullet + gray label + white value
#   syntax: aqua command hints
# All messages use MiniMessage formatting
# Placeholders: %player_name%, %player%, %display_name%, %world%, %world_name%,
#               %online%, %online_players%, %max_players%, %health%, %health_points%,
#               %food%, %xp_level%, %item_name%, %item_in_hand%

# ============================================================
# STARTUP MESSAGES
# ============================================================

startup:
  loading: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>FlameForge is still loading: <white>%pending_components%"
  failed: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>FlameForge startup failed in <white>%component%<gray>: <white>%reason% <gray>(reference: %reference%)"
  failed-retryable: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>Correct the reported file and run <aqua>/flameforge reload<gray> to retry startup."
  restart-required: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Correct the console error and restart the server."
  unavailable: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>FlameForge is disabled or shutting down."

# ============================================================
# COMMAND MESSAGES
# ============================================================

# Main command
command:
  unknown: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Unknown command. Use <aqua>/flameforge help <gray>for available commands."
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  failed: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>FlameForge is unavailable because startup failed: <white>%reason%"
  loading: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>FlameForge is still loading, try again shortly."
  player-only: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>This command can only be used by a player."
  unavailable: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>FlameForge is disabled or shutting down."

# Help command
help:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  border: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  root-header: "<gradient:#ff6a00:#ffd166><bold>%plugin_name% %plugin_version%</bold></gradient> <gray>by <white>%plugin_authors%"
  group-header: "<gradient:#ff6a00:#ffd166><bold>%plugin_name% — %group_name%</bold></gradient>"
  entry: "<gradient:#ff8a00:#ffe29a>/%label% %usage%</gradient> <dark_gray>- <gray>%description%"
  hover: "<gray>Click to insert <white>/%label% %suggestion%"
  empty: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>No commands are available for this path."
  unknown-path: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Unknown help path: <white>%path%"
  descriptions:
    help: "Show this help message"
    open: "Open the forge menu"
    tiers: "List all forge tiers"
    tier-info: "Show tier details"
    preview: "Preview forge outcomes"
    testitem: "Test forge item mutations"
    history: "View your forge history"
    station-teleport: "Teleport to a forge station"
    station-add: "Add a new forge station"
    station-remove: "Remove a forge station"
    station-list: "List all forge stations"
    station-info: "Show station details"
    reload: "Reload configuration"
    validate: "Validate configuration"
    setup-tier-create: "Create a new tier"
    setup-tier-clone: "Clone an existing tier"
  categories:
    general: "General"
    forging: "Forging"
    forge-management: "Forge Management"
    administration: "Administration"

# Open command
open:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required to open your forge menu: <white>%permission%"
  player-only: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>This command can only be used by a player."
  player-offline: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Target player is offline."
  no-target: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Target player is not online."
  no-forge-target: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>No forge found at your target location."
  forge-not-found: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>No forge found with id: <white>%station_id%"
  profile-not-found: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Forge '<white>%station_id%<gray>' has no valid station profile."
  station-permission-required: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>You do not have permission to use this forge. Required: <white>%permission%"
  no-allowed-tier: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>You do not have an allowed tier for forge '<white>%station_id%<gray>'."
  scheduler-rejected: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>The scheduler rejected opening forge '<white>%station_id%<gray>': <white>%reason% <gray>(reference: %reference%)"
  menu-open-failed: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Failed to open forge '<white>%station_id%<gray>': <white>%reason% <gray>(reference: %reference%)"
  player-retired: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>The player disconnected before the forge could be opened."
  menu-opened: "<gradient:#22c55e:#86efac><bold>✔</bold></gradient> <gray>Forge menu opened for <white>%player_name%<gray> at station <white>%station_id%<gray>."

# Forge interact listener
forge-interact:
  open-failed: "<red>Failed to open forge: <white>%status%<red><gray> (station: <white>%station_id%<gray>)"

# Reload command
reload:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  started: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>Reloading FlameForge configuration..."
  success: "<gradient:#22c55e:#86efac><bold>✔</bold></gradient> <gray>Configuration applied. Runtime services refreshed."
  validation-rejected: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Reload rejected because configuration validation found errors. The previous configuration remains active."
  already-running: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>A FlameForge reload is already running."
  startup-retry-started: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>Retrying FlameForge startup..."
  startup-already-loading: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>FlameForge startup is already running."
  startup-already-ready: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>FlameForge is already ready."
  restart-required: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>This startup failure requires a full server restart."
  scheduler-rejected: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>The scheduler rejected the reload task. Reference: %reference%"
  load-failed: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Configuration reload could not read/parse the files: <white>%reason%"
  unavailable: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>FlameForge is disabled or shutting down."

# Validate command
validate:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  started: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>Validating FlameForge configuration without applying changes..."
  passed: "<gradient:#22c55e:#86efac><bold>✔</bold></gradient> <gray>Configuration validation passed with no errors."
  error: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>%path%<gray>: <white>%message%"
  warning: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>%path%<gray>: <white>%message%"
  already-running: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>A configuration reload or validation is already running."
  scheduler-rejected: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>The scheduler rejected validation. Reference: %reference%"
  load-failed: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Configuration validation could not run: <white>%reason% <gray>(reference: %reference%)"

# Tiers command
tiers:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  header: "<dark_gray>━━━━━━━━ <gradient:#ff6a00:#ffd166><bold>Tiers</bold></gradient> <dark_gray>━━━━━━━━"
  entry: "<dark_gray>• <white>%tier_id% <gray>(Level: <white>%level%<gray>)"
  empty: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>No tiers configured."
  footer: "<gray>Page <white>%page% <dark_gray>/ <white>%total_pages% <gray>— <aqua>/flameforge tiers <page>"

# Tier info command
tier-info:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  usage: "<dark_gray>• <gray>Usage: <aqua>/flameforge tier info <tier>"
  header: "<dark_gray>━━━━━━━━ <gradient:#ff6a00:#ffd166><bold>Tier: %tier_id%</bold></gradient> <dark_gray>━━━━━━━━"
  level: "<dark_gray>• <gray>Level: <white>%level%"
  enabled: "<dark_gray>• <gray>Enabled: <white>%enabled%"
  cooldown: "<dark_gray>• <gray>Cooldown: <white>%seconds% <gray>seconds"
  requirements-combine: "<dark_gray>• <gray>Requirement mode: <white>%combine%"
  requirement-xp: "<dark_gray>  • <gray>XP level: <white>%level%"
  requirement-money: "<dark_gray>  • <gray>Money: <green>$%amount%"
  requirements-items-header: "<dark_gray>• <gray>Required items:"
  requirement-item: "<dark_gray>  • <white>%amount%x <gray>%materials% <dark_gray>%name%"
  chances: "<dark_gray>• <gray>Chances: <green>%success%% <dark_gray>/ <red>%break%% <dark_gray>/ <light_purple>%curse%%"
  variants-header: "<dark_gray>• <gray>Variants <white>(%count%)"
  variant-entry: "<dark_gray>  • <white>%variant_id% <dark_gray>— <gray>%name% <dark_gray>(weight <white>%weight%<dark_gray>)"
  not-found: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Tier not found: <white>%tier_id%"

# Preview command
preview:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  player-only: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>This command can only be used by a player."
  usage: "<dark_gray>• <gray>Usage: <aqua>/flameforge preview <tier> [material]"
  tier-not-found: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Tier not found: <white>%tier_id%"
  no-item: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>You must be holding an item to preview."
  unknown-material: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Unknown material: <white>%material%"
  no-variants: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>This tier has no variants configured."
  no-eligible-variant: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>No eligible variant found for the held item."
  variant: "<gradient:#22c55e:#86efac><bold>✔</bold></gradient> <gray>Preview for tier '<white>%tier_id%<gray>': <white>%variant_name% <gray>(<white>%variant_id%<gray>)"
  material: "<dark_gray>• <gray>Result material: <white>%material%"

# Test item command
testitem:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  player-only: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>This command can only be used by a player."
  usage: "<dark_gray>• <gray>Usage: <aqua>/flameforge testitem <tier> <variant> [material]"
  tier-not-found: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Tier not found: <white>%tier_id%"
  variant-not-found: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Variant '<white>%variant_id%<gray>' not found in tier '<white>%tier_id%<gray>'."
  material-unavailable: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Material unavailable: <white>%material%"
  material-category-mismatch: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Material <white>%material% <gray>(category <white>%category%<gray>) does not match the tier's required category <white>%required_category%<gray>."
  variant-ineligible: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Variant '<white>%variant_id%<gray>' is not eligible for material <white>%material% <gray>in tier '<white>%tier_id%<gray>'."
  mutation-failed: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Item mutation failed for <white>%material% <gray>in tier '<white>%tier_id%<gray>' variant '<white>%variant_id%<gray>'."
  success: "<gradient:#22c55e:#86efac><bold>✔</bold></gradient> <gray>Test item created: <white>%material% <gray>for tier <white>%tier_id% <gray>variant <white>%variant_id%<gray>."

# History command
history:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  usage: "<dark_gray>• <gray>Usage: <aqua>/flameforge history <player>"
  header: "<dark_gray>━━━━━━━━ <gradient:#ff6a00:#ffd166><bold>History: %player_name%</bold></gradient> <dark_gray>━━━━━━━━"
  no-history: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>No history found for <white>%player_name%"
  current-tier: "<dark_gray>• <gray>Current Tier: <white>%tier%"
  not-implemented: "<dark_gray>• <gray>(Full history log not yet implemented)"

# Station command
station:
  usage: "<dark_gray>• <gray>Usage: <aqua>/flameforge station <add|remove|list|info|teleport> [args]"
  unknown: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Unknown station command. Use <aqua>/flameforge station list <gray>to see available commands."

# Station add
station-add:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required to register a forge: <white>%permission%"
  player-only: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>This command can only be used by a player."
  usage: "<dark_gray>• <gray>Usage: <aqua>/flameforge station add [id] [profile]"
  invalid-id: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Invalid forge id '<white>%station_id%<gray>'. Use letters, numbers, underscore, and hyphen only."
  unknown-profile: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Unknown station profile: <white>%station_id%"
  no-block: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>You must be looking at a non-air block."
  target-unavailable: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>The targeted block for '<white>%station_id%<gray>' is unavailable. Move closer and retry."
  duplicate-id: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>A forge already uses id: <white>%station_id%"
  duplicate-location: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>A forge is already registered at that block."
  storage-conflict: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>The station file <white>stations/%station_id%.yml<gray> already exists but was not loaded. Correct or remove that file before reusing this ID. Reference: %reference%"
  persistence-failed: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>The station could not be saved to <white>stations/%station_id%.yml<gray>. No station was registered. Reference: %reference%"
  id-generation-exhausted: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Could not generate a unique forge id after eight attempts."
  success: "<gradient:#22c55e:#86efac><bold>✔</bold></gradient> <gray>Forge registered: <white>%station_id% <gray>(<white>%world% %x%,%y%,%z%<gray>, profile <white>%profile%<gray>)"

# Teleport command alias
tp:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  player-only: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>This command can only be used by a player."
  usage: "<dark_gray>• <gray>Usage: <aqua>/flameforge tp <id>"
  success: "<gradient:#22c55e:#86efac><bold>✔</bold></gradient> <gray>Teleported to forge: <white>%station_id%"
  not-found: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>No forge found with id: <white>%station_id%"
  player-offline: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Target player is offline."
  world-not-found: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Forge world could not be found."
  world-not-loaded: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Forge world is not loaded. Move closer and retry."
  teleport-rejected: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Teleport was rejected by the server."
  teleport-exception: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Teleport failed: <white>%reason%"
  player-retired: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>The player disconnected before teleport could complete."
  scheduler-rejected: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>The scheduler rejected the teleport task."

# Station remove
station-remove:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  usage: "<dark_gray>• <gray>Usage: <aqua>/flameforge station remove <id>"
  success: "<gradient:#22c55e:#86efac><bold>✔</bold></gradient> <gray>Forge removed: <white>%station_id%"
  not-found: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>No forge found with id: <white>%station_id%"
  persistence-failed: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Station '<white>%station_id%<gray>' remains registered because <white>stations/%station_id%.yml<gray> could not be removed. Reference: %reference%"

# Station list
station-list:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  header: "<dark_gray>━━━━━━━━ <gradient:#ff6a00:#ffd166><bold>Stations</bold></gradient> <dark_gray>━━━━━━━━"
  entry: "<dark_gray>• <white>%station_id% <dark_gray>[<white>%world% %x%,%y%,%z%<dark_gray>] <gray>(Profile: <white>%profile%<gray>)"
  empty: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>No stations configured."
  footer: "<gray>Page <white>%page% <dark_gray>/ <white>%total_pages% <gray>— <aqua>/flameforge station list <page>"

# Station info
station-info:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  usage: "<dark_gray>• <gray>Usage: <aqua>/flameforge station info <id>"
  header: "<dark_gray>━━━━━━━━ <gradient:#ff6a00:#ffd166><bold>Station: %station_id%</bold></gradient> <dark_gray>━━━━━━━━"
  world: "<dark_gray>• <gray>World: <white>%world%"
  location: "<dark_gray>• <gray>Location: <white>%x%, %y%, %z%"
  profile: "<dark_gray>• <gray>Profile: <white>%profile%"
  max-tier: "<dark_gray>• <gray>Max Tier: <white>%max_tier%"
  not-found: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Station not found: <white>%station_id%"

# Station teleport
station-teleport:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  player-only: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>This command can only be used by a player."
  usage: "<dark_gray>• <gray>Usage: <aqua>/flameforge station teleport <id>"
  success: "<gradient:#22c55e:#86efac><bold>✔</bold></gradient> <gray>Teleported to forge: <white>%station_id%"
  not-found: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>No forge found with id: <white>%station_id%"
  player-offline: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Target player is offline."
  world-not-found: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Forge world could not be found."
  world-not-loaded: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Forge world is not loaded. Move closer and retry."
  teleport-rejected: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Teleport was rejected by the server."
  teleport-exception: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Teleport failed: <white>%reason%"
  player-retired: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>The player disconnected before teleport could complete."
  scheduler-rejected: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>The scheduler rejected the teleport task."

# Setup tier command
setup:
  no-permission: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Permission required: <white>%permission%"
  usage: "<dark_gray>• <gray>Usage: <aqua>/flameforge setup tier <create|clone> [args]"
  unknown: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Unknown setup command. Use <aqua>/flameforge setup tier create|clone"

# Setup tier create
setup-tier-create:
  usage: "<dark_gray>• <gray>Usage: <aqua>/flameforge setup tier create <id> <level>"
  level-invalid: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Level must be a number."
  already-exists: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Tier already exists: <white>%tier_id%"
  success: "<gradient:#22c55e:#86efac><bold>✔</bold></gradient> <gray>Tier '<white>%tier_id%<gray>' created with level <white>%level%<gray>."
  note: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>Note: New tiers are not populated with default outcomes. Edit the tier file manually."

# Setup tier clone
setup-tier-clone:
  source-not-found: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Source tier not found: <white>%source_id%"
  usage: "<dark_gray>• <gray>Usage: <aqua>/flameforge setup tier clone <source> <id> <level>"
  level-invalid: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Level must be a number."
  already-exists: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>Tier already exists: <white>%new_id%"
  failure: "<gradient:#ef4444:#fb7185><bold>✖</bold></gradient> <gray>The tier could not be cloned. Check the console for details."
  success: "<gradient:#22c55e:#86efac><bold>✔</bold></gradient> <gray>Tier '<white>%new_id%<gray>' cloned from '<white>%source_id%<gray>' with level <white>%level%<gray>."
  note: "<gradient:#f59e0b:#fde68a><bold>!</bold></gradient> <gray>Note: Cloned tiers inherit all settings. Edit the tier file manually to adjust."

# ============================================================
# SUCCESS / ERROR / TITLE / ACTIONBAR MESSAGES
# ============================================================

# Forge outcomes
forge:
  success:
    title: "<gold><bold>FORGE SUCCESS!"
    subtitle: "<white>%player_name% <green>received a powerful item!"
  fail:
    title: "<red><bold>FORGE FAILED"
    subtitle: "<white>%player_name% <red>lost their item"
  ward-converted:
    title: "<aqua><bold>WARD PROTECTED"
    subtitle: "<white>Your item was protected by a ward"
  confirm:
    complete: "<green>Forge completed."
    failed: "<red>Forging failed: <white>%reason%"

# Cooldown messages
cooldown:
  active: "<red>You are on cooldown. Wait <yellow>%remaining%s<red>."
  expired: "<green>Cooldown expired. You can forge again."



# Insufficient funds / XP
cost:
  insufficient-xp: "<red>Insufficient XP. Need <light_purple>%required% XP<red>."
  insufficient-money: "<red>Insufficient funds. Need <green>$%required%<red>."
  insufficient-both: "<red>Insufficient resources. Need <light_purple>%xp_required% XP<red> and <green>$%money_required%<red>."
  xp-line: "<light_purple>XP Cost: <light_purple>%cost% XP"
  money-line: "<green>Money Cost: <green>$%cost%"
  not-affordable: "<red>(Not affordable)"

# Item validation
validation:
  no-item: "<red>No item found in input slot."
  wrong-stack-size: "<red>Stack size must be exactly 1."
  item-not-allowed: "<red>This item cannot be forged at this station."
  tier-locked: "<red>This tier is locked at your station. Upgrade to access."
  tier-unavailable: "<red>This tier is currently unavailable."



# Announcement titles (for title/subtitle broadcasts)
announcements:
  success:
    title: "<gold><bold>FORGE SUCCESS!"
    subtitle: "<white>%player_name% <green>received a powerful item!"
  fail:
    title: "<red><bold>FORGE FAILED"
    subtitle: "<white>%player_name% <red>lost their item"

# ============================================================
# MENU MESSAGES
# ============================================================

menu:
  title: "FlameForge"  # 1.8-safe title (no MiniMessage)
  filler-name: " "
  input-placeholder:
    name: "<dark_gray><bold>Input Item"
    lore:
      - "<gray>Place your item here"
      - "<gray>(Stack size must be exactly 1)"

  confirm-available:
    name: "<green><bold>Confirm Forge"
  confirm-unavailable:
    name: "<red><bold>Cannot Afford"
  previous-enabled:
    name: "<yellow><bold>Previous Page"
    lore:
      - "<gray>Click to go to previous page"
  previous-disabled:
    name: "<gray><bold>Previous Page"
    lore:
      - "<red>No previous page"
  next-enabled:
    name: "<yellow><bold>Next Page"
    lore:
      - "<gray>Click to go to next page"
  next-disabled:
    name: "<gray><bold>Next Page"
    lore:
      - "<red>No next page"
  close:
    name: "<red><bold>Close"
    lore:
      - "<gray>Click to close the menu"
  input-occupied: "<red>That input slot is already occupied."
  item-inserted: "<green>Item inserted into the forge."
  item-denied:
    no-tier: "<red>This item cannot be forged because there are no tiers available."
    invalid-identity: "<red>This forged item contains invalid FlameForge data and cannot be used safely."
    unsupported: "<red>This item type is not supported by the next forge tier."
    customized: "<red>This item contains custom data that cannot be forged safely."
    cursed: "<red>This cursed item cannot be forged again."
    station: "<red>This forge station cannot upgrade this item to its next tier."
    permission: "<red>You do not have permission to use the next forge tier."
    empty: "<red>Please insert an item."
  requirements-not-met: "<red>You do not meet the forge requirements yet."
  item-returned: "<green>Item returned to your inventory."
  item-dropped: "<yellow>Item dropped at your feet."
  item-queued: "<green>Item added to delivery queue."
  stale-click: "<yellow>Nothing happened. Try again."
  cursor-not-empty: "<red>Your cursor must be empty."
  forge-already-started: "<yellow>The forge is already processing an item."
  forge-start-failed: "<red>Failed to start forging."
  no-input: "<red>No item found in input slot."
  info:
    name: "<gold><bold>FlameForge"
    lore:
      - "<gray>Welcome to the FlameForge"
      - "<gray>Place items in the slots below"
      - "<gray>Select a tier and confirm to forge"

# ============================================================
# DELIVERY / PENDING MESSAGES
# ============================================================

delivery:
  pending-title: "<yellow>Items Pending Delivery"
  pending-lore:
    - "<gray>You have items waiting"
    - "<gray>Click to collect"
  delivered: "<green>Item delivered to your inventory."
  dropped: "<yellow>Item dropped at your feet."
  full-inventory: "<yellow>Your inventory is full. Item dropped at your feet."
