    start-pitch: 0.50
    end-pitch: 2.00
  charge-particle:
    candidates:
      - FLAME
    count: 12
    radius: 1.20
  impact-particle:
    candidates:
      - CRIT
      - FLAME
    material-candidates:
      - ANVIL
  success:
    sound-candidates:
      - BLOCK_ANVIL_USE
      - ANVIL_USE
    particle-candidates:
