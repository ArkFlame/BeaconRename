# FlameForge Root Configuration
# MMO Forge Theme: dark_gray, purple, white, lime, gold
# All values use MiniMessage formatting unless noted

# Schema version - do not modify
schema-version: 2

# Plugin enabled state
enabled: true

# Station behavior mode: ANY_BLOCK allows any non-air block, REGISTERED_ONLY requires registered forges
station-mode: REGISTERED_ONLY

# Audit log settings
audit-queue-capacity: 1024
audit:
  enabled: true
  folder: audit
  max-file-age-days: 30

# Chance calculation settings
chance-decimals: 4
chance-display-decimals: 1

# Unsafe enchantments list - these enchants cannot be forged
unsafe-enchants:
  - CURSE_OF_VOIDING
  - CURSE_OF_TERRIBLE_DEATH

# Item group definitions for filtering
item-groups:
  swords:
    materials:
      - diamond_sword
      - iron_sword
      - gold_sword
      - stone_sword
      - wooden_sword
  pickaxes:
    materials:
      - diamond_pickaxe
      - iron_pickaxe
      - gold_pickaxe
      - stone_pickaxe
      - wooden_pickaxe
  armor:
    materials:
      - diamond_helmet
      - diamond_chestplate
      - diamond_leggings
      - diamond_boots
      - iron_helmet
      - iron_chestplate
      - iron_leggings
      - iron_boots
      - gold_helmet
      - gold_chestplate
      - gold_leggings
      - gold_boots
      - chainmail_helmet
      - chainmail_chestplate
      - chainmail_leggings
      - chainmail_boots
      - leather_helmet
      - leather_chestplate
      - leather_leggings
      - leather_boots



# Announcement settings
announcements:
  global:
    enabled: true
    radius: 0
    title:
      success: "<gold><bold>FORGE SUCCESS!"
      fail: "<red><bold>FORGE FAILED"
    subtitle:
      success:
        - "<white>%player_name% <green>received a powerful item!"
        - "<gray>%item_name%"
      fail:
        - "<white>%player_name% <red>lost their item"
  station:
    enabled: true
    radius: 16
    title:
      success: "<gold><bold>FORGE SUCCESS!"
      fail: "<red><bold>FORGE FAILED"
    subtitle:
      success:
        - "<white>%player_name% <green>forged successfully!"
      fail:
        - "<white>%player_name% <red>forged and lost"

# Animation profile defaults
animation-profile: default

# Menu profile defaults
menu-profile: default



# Default cost display format
cost-display:
  xp-format: "{value} XP"
  money-format: "${value}"
  show-zero-xp: false
  show-zero-money: false

# Cost color overrides
cost-colors:
  xp: "light_purple"
  money: "green"
  item: "aqua"

forge:
  passive-refresh-ticks: 20
  power-cooldown-max-entries: 4096
  reject-foreign-persistent-data: true
  menu:
    profile: default

# Hologram settings
holograms:
  enabled: true
  provider-order:
    - FancyHolograms
    - DecentHolograms
  offset-y: 1.75
  transparent-background: true
  lines:
    - "<gradient:#ff5f00:#ffd166><bold>FlameForge</bold></gradient>"
    - "<gray>%forge_id%"
