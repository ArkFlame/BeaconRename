name: FlameForge
version: ${project.version}
main: com.arkflame.flameforge.FlameForgePlugin
author: ArkFlame Studios
api-version: 1.13
folia-supported: true
depend:
  - packetevents
softdepend:
  - Vault
  - FancyHolograms
  - DecentHolograms

commands:
  flameforge:
    description: The root command for FlameForge
    aliases: [forge, ff]
    usage: /<command> help
    permission: flameforge.use

permissions:
  flameforge.use:
    description: Allows basic usage of FlameForge
    default: true
  flameforge.command.help:
    description: Allows using the help command
    default: true
  flameforge.command.open:
    description: Allows opening the forge menu
    default: true
  flameforge.command.open.others:
    description: Allows opening the forge menu for other players
    default: op
  flameforge.command.reload:
    description: Allows reloading the configuration
    default: op
  flameforge.command.validate:
    description: Allows validating forge configurations
    default: op
  flameforge.command.tiers:
    description: Allows listing all tiers
    default: op
  flameforge.command.tier.info:
    description: Allows viewing tier information
    default: op
  flameforge.command.preview:
    description: Allows previewing forge outcomes
    default: op
  flameforge.command.history:
    description: Allows viewing forge history
    default: true
  flameforge.command.history.others:
    description: Allows viewing other players' forge history
    default: op
  flameforge.command.station.add:
    description: Allows adding forges
    default: op
  flameforge.command.station.remove:
    description: Allows removing forges
    default: op
  flameforge.command.station.list:
    description: Allows listing forges
    default: op
  flameforge.command.station.info:
    description: Allows viewing forge info
    default: op
  flameforge.command.station.teleport:
    description: Allows teleporting to forges
    default: op
  flameforge.command.setup.tier:
    description: Allows setting up tiers
    default: op
  flameforge.command.testitem:
    description: Allows spawning test forge items
    default: op
  flameforge.command.weaponsmenu:
    description: Allows browsing forged weapon examples
    default: op
  flameforge.bypass.cost:
    description: Allows bypassing forge costs
    default: op
  flameforge.bypass.cooldown:
    description: Allows bypassing forge cooldowns
    default: op
  flameforge.admin:
    description: Grants full admin access
    default: op
    children:
      flameforge.use: true
      flameforge.command.help: true
      flameforge.command.open: true
      flameforge.command.open.others: true
      flameforge.command.reload: true
      flameforge.command.validate: true
      flameforge.command.tiers: true
      flameforge.command.tier.info: true
      flameforge.command.preview: true
      flameforge.command.history: true
      flameforge.command.history.others: true
      flameforge.command.station.add: true
      flameforge.command.station.remove: true
      flameforge.command.station.list: true
      flameforge.command.station.info: true
      flameforge.command.station.teleport: true
      flameforge.command.setup.tier: true
      flameforge.command.testitem: true
      flameforge.command.weaponsmenu: true
