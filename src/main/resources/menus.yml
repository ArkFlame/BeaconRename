# FlameForge Menu Configuration
# MMO Forge Theme: dark_gray, purple, white, lime, gold
# Menu titles must be 1.8-safe (legacy color codes only)

# ============================================================
# MENU PROFILES
# ============================================================

# Default menu profile
default:
  # 1.8-safe title - uses legacy & color codes only
  title: "&6&lFlameForge"
  # Size: 54 slots (6 rows)
  size: 54
  # Fill material
  filler:
    material: STAINED_GLASS_PANE
    data: 7
    name: " "
  # Slot assignments
  slots:
    info: 4
    catalyst: 11
    input: 13
    ward: 15
    confirm: 22
    previous: 27
    tier-start: 28
    tier-end: 34
    next: 35
    pity-history: 40
    close: 49
  # Item overrides per slot
  items:
    info:
      material: NETHER_STAR
      name: "&6&lFlameForge"
      lore:
        - "&7Welcome to the FlameForge"
        - "&7Place items in the slots below"
        - "&7Select a tier and confirm to forge"
    input:
      material: BLACK_STAINED_GLASS_PANE
      name: "&8&lInput Item"
      lore:
        - "&7Place your item here"
        - "&7(Stack size must be exactly 1)"
    catalyst:
      material: CYAN_STAINED_GLASS_PANE
      name: "&b&lCatalyst"
      lore:
        - "&7Optional: Place a catalyst"
        - "&7to modify outcomes"
    ward:
      material: MAGENTA_STAINED_GLASS_PANE
      name: "&d&lWard"
      lore:
        - "&7Optional: Place a ward"
        - "&7to protect your item"
    confirm:
      material-when-available: EMERALD_BLOCK
      material-when-unavailable: REDSTONE_BLOCK
      name-when-available: "&a&lConfirm Forge"
      name-when-unavailable: "&c&lCannot Afford"
    previous:
      material-when-enabled: ARROW
      material-when-disabled: BARRIER
      name-when-enabled: "&e&lPrevious Page"
      name-when-disabled: "&7&lPrevious Page"
    next:
      material-when-enabled: ARROW
      material-when-disabled: BARRIER
      name-when-enabled: "&e&lNext Page"
      name-when-disabled: "&7&lNext Page"
    close:
      material: BARRIER
      name: "&c&lClose"
      lore:
        - "&7Click to close the menu"
    pity-history:
      material: BOOK
      name: "&5&lPity / History"
      lore:
        - "&7Current Pity: &d%pity%"
        - "&7Click to view history"
  # Tier item defaults
  tier:
    available-material: DIAMOND
    available-name: "&e&l%tier_id%"
    available-lore:
      - "&7Tier Level: &e%tier_level%"
      - "&aClick to select"
    selected-material: NETHER_STAR
    selected-name: "&6&l%tier_id%"
    selected-lore:
      - "&7Tier Level: &e%tier_level%"
      - "&aSelected"
    locked-material: IRON_BARS
    locked-name: "&7&l%tier_id%"
    locked-lore:
      - "&7Tier Level: &c%tier_level%"
      - "&cLocked - Upgrade station"
    unavailable-material: COBBLESTONE
    unavailable-name: "&8&l%tier_id%"
    unavailable-lore:
      - "&7Tier Level: &8%tier_level%"
      - "&cUnavailable"

# Compact menu profile (fewer slots, smaller display)
compact:
  title: "&6FlameForge"
  size: 27
  filler:
    material: STAINED_GLASS_PANE
    data: 7
    name: " "
  slots:
    info: 4
    input: 11
    confirm: 13
    tier-start: 15
    tier-end: 20
    close: 22
  items:
    info:
      material: NETHER_STAR
      name: "&6&lFlameForge"
      lore:
        - "&7MMO Forge Station"
    input:
      material: BLACK_STAINED_GLASS_PANE
      name: "&8&lPlace Item"
    confirm:
      material-when-available: EMERALD_BLOCK
      material-when-unavailable: REDSTONE_BLOCK
    close:
      material: BARRIER
      name: "&c&lClose"

