schema-version: 2

default:
  title: "<gold><bold>FlameForge</bold>"
  size: 54

  background:
    materials:
      - GRAY_STAINED_GLASS_PANE
      - "STAINED_GLASS_PANE:7"
      - GLASS_PANE
    name: " "

  slots:
    input: 22
    confirm: 31

  items:
    confirm:
      empty:
        materials:
          - REDSTONE_BLOCK
          - REDSTONE
        glow: false
        name: "<gradient:#ef4444:#7f1d1d><bold>No Item Selected</bold></gradient>"
        lore:
          - "<red>No item inserted.</red>"
          - "<gray>Click an item in your inventory to forge.</gray>"

      blocked:
        materials:
          - REDSTONE_BLOCK
          - REDSTONE
        glow: false
        name: "<gradient:#ef4444:#7f1d1d><bold>Forge Unavailable</bold></gradient>"
        lore:
          - "%tier_line%"
          - " "
          - "<gradient:#f97316:#facc15><bold>Requirements</bold></gradient>"
          - "%requirements%"
          - " "
          - "<gradient:#60a5fa:#a78bfa><bold>Chances</bold></gradient>"
          - "%chances%"
          - " "
          - "<gradient:#c084fc:#f0abfc><bold>Possible Variants</bold></gradient>"
          - "%variants%"
          - " "
          - "<red>Meet the missing requirements to forge.</red>"

      ready:
        materials:
          - EMERALD_BLOCK
          - EMERALD
        glow: true
        name: "<gradient:#22c55e:#a3e635><bold>Forge Item</bold></gradient>"
        lore:
          - "%tier_line%"
          - " "
          - "<gradient:#f97316:#facc15><bold>Requirements</bold></gradient>"
          - "%requirements%"
          - " "
          - "<gradient:#60a5fa:#a78bfa><bold>Chances</bold></gradient>"
          - "%chances%"
          - " "
          - "<gradient:#c084fc:#f0abfc><bold>Possible Variants</bold></gradient>"
          - "%variants%"
          - " "
          - "<gradient:#22c55e:#a3e635><bold>Click to forge!</bold></gradient>"

  dynamic-lines:
    tier: "<gray>Tier: <white>%current_tier% <dark_gray>→ <white>%target_tier%"

    requirement-mode-any: "<gray>Meet any one requirement:"
    requirement-none: "<green>✔ <gray>No additional requirements."
    requirement-xp-met: "<green>✔ <gray>XP: <white>%xp_available%/%xp_required%"
    requirement-xp-missing: "<red>✘ <gray>XP: <white>%xp_available%/%xp_required%"
    requirement-money-met: "<green>✔ <gray>Money: <white>%money_available%/%money_required%"
    requirement-money-missing: "<red>✘ <gray>Money: <white>%money_available%/%money_required%"
    requirement-money-unavailable: "<red>✘ <gray>Money: <red>economy unavailable"
    requirement-item-met: "<green>✔ <gray>%item_name%: <white>%item_available%/%item_required%"
    requirement-item-missing: "<red>✘ <gray>%item_name%: <white>%item_available%/%item_required%"

    chance-success: "<dark_gray>• <green>Success <white>%success_chance%%"
    chance-break: "<dark_gray>• <red>Break/reset <white>%break_chance%%"
    chance-curse: "<dark_gray>• <dark_purple>Curse <white>%curse_chance%%"

    variant-entry: "<dark_gray>• %variant_name% <gray>— <aqua>%variant_chance%%"

weapons-preview:
  title: "<gold><bold>Weapons</bold> <gray>%page%/%pages% "
  size: 54
  background:
    materials:
      - GRAY_STAINED_GLASS_PANE
      - "STAINED_GLASS_PANE:7"
      - GLASS_PANE
    name: " "
  previous:
    materials:
      - ARROW
    name: "<yellow><bold>Previous Page</bold>"
    lore:
      - "<gray>Go to page <white>%target_page% "
  next:
    materials:
      - ARROW
    name: "<yellow><bold>Next Page</bold>"
    lore:
      - "<gray>Go to page <white>%target_page% "
  page-info:
    materials:
      - PAPER
      - BOOK
    name: "<gradient:#f97316:#facc15><bold>Weapon Catalog</bold></gradient>"
    lore:
      - "<gray>Page <white>%page%<gray>/<white>%pages%"
      - "<gray>Click a weapon to receive one."
